name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The mod API is early access and moves between releases: test against the version the mod was last checked with.
      - run: npm install -g @anthropic-ai/claude-code@2.1.296
      - run: claude plugin validate .
      - run: claude plugin test .
