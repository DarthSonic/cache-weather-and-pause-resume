name: Bug report
description: Something in the band does not work as the README describes
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. English or German, as you like. / Gern auch auf Deutsch.
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      description: The version `/plugin` shows, or `codeVersion` in `~/.claude/cache-weather-and-pause-resume/state.json`.
      placeholder: "0.9.0"
    validations:
      required: true
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      description: The output of `claude --version`.
      placeholder: "2.1.319"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where the band runs
      options:
        - Terminal (CLI)
        - Claude desktop app
        - VS Code
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: The steps that lead there help most, and a screenshot of the band.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: Dim lines in the transcript that name the mod, or lines of `claude --debug`. Remove anything private first.
      render: text
